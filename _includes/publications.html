<div class="publication-list">
  {% for pub in site.data.publications %}
  <p><b><u>{{ pub.title }}</u></b>
    {% for link in pub.links %}
    [<a href="{{ link.url }}" target="_blank">{{ link.label }}</a>]
    {% endfor %}
    {% if pub.bib %}
    [<a href="javascript:void(0);" onclick="openBibModal('{{ pub.bib }}')">bib</a>]
    {% endif %}
    <br />
    &nbsp;&nbsp; &nbsp; {{ pub.authors }} <br />
    &nbsp;&nbsp; &nbsp; {{ pub.venue }}
  </p>
  {% endfor %}
</div>
